<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Marcador de muertes - Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --negro: #0D0D0D;
    --neon: #FF007F;
    --pastel: #FFC1DA;
    --blanco: #FFFFFF;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  /* Escenario fijo de 1040x372 que se escala para llenar el Browser Source */
  #stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1040px;
    height: 372px;
    transform-origin: center center;
    transform: translate(-50%, -50%);
    font-family: 'Fredoka', 'Quicksand', 'Segoe UI', sans-serif;
  }

  /* Titulo central, encima de los dos nombres */
  .titulo {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    font-weight: 500;
    letter-spacing: 12px;
    text-indent: 12px;
    color: var(--blanco);
    opacity: 0.85;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
  }

  /* Nombres sobre el borde superior de cada marco */
  .nombre {
    position: absolute;
    top: 34px;
    width: 520px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 6px;
    text-indent: 6px;
    line-height: 1;
    white-space: nowrap;
  }
  #nombre-kizashi {
    left: 0;
    color: var(--blanco);
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
  }
  #nombre-bloodsitax {
    left: 520px;
    color: var(--pastel);
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85), 0 0 14px rgba(255, 0, 127, 0.55);
  }

  /* Marcos pegados, sin sobreponerse (cada PNG mide 1649 x 954) */
  .marco {
    position: absolute;
    top: 71px;
    width: 520px;
    height: 301px;
  }
  #marco-kizashi { left: 0; }
  #marco-bloodsitax { left: 520px; }

  /* Relleno de color que queda DETRAS del marco, dentro del hueco */
  .relleno {
    position: absolute;
    left: 6.5%;
    right: 6.5%;
    top: 9%;
    bottom: 10%;
    border-radius: 12px;
  }
  #marco-kizashi .relleno {
    background: radial-gradient(ellipse at center, #1C1C1C 0%, var(--negro) 65%, #000 100%);
  }
  #marco-bloodsitax .relleno {
    background: radial-gradient(ellipse at center, var(--neon) 0%, #E6006F 60%, #A80050 100%);
  }

  .arte {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }

  /* Zona segura del numero: lejos de engranajes, balas, sierra y estandarte */
  .contenido {
    position: absolute;
    left: 18%;
    right: 18%;
    top: 19%;
    bottom: 17%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .numero {
    font-size: 156px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    transform-origin: center 60%;
  }
  /* Con 4 digitos el numero se achica para no tocar el marco */
  .numero.largo { font-size: 120px; }

  #marco-kizashi .contenido {
    color: var(--blanco);
    text-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
  }
  #marco-bloodsitax .contenido {
    color: var(--pastel);
    text-shadow: 0 3px 8px rgba(110, 0, 55, 0.6);
  }

  .bump {
    animation: bump 380ms cubic-bezier(.2, 1.4, .4, 1);
  }

  @keyframes bump {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .bump { animation: none; }
  }
</style>
</head>
<body>

<div id="stage">
  <div class="titulo">MUERTES</div>

  <div class="nombre" id="nombre-kizashi">KIZASHI</div>
  <div class="nombre" id="nombre-bloodsitax">BLOODSITAX</div>

  <div class="marco" id="marco-kizashi">
    <div class="relleno"></div>
    <img class="arte" src="marco-kizashi.png" alt="">
    <div class="contenido">
      <div class="numero" id="num-kizashi">0</div>
    </div>
  </div>

  <div class="marco" id="marco-bloodsitax">
    <div class="relleno"></div>
    <img class="arte" src="marco-bloodsitax.png" alt="">
    <div class="contenido">
      <div class="numero" id="num-bloodsitax">0</div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDVgErtkYAK1OLghyxRlqCN4Sg_qmbmGSk",
    authDomain: "contador-muertes-bloodsitax.firebaseapp.com",
    databaseURL: "https://contador-muertes-bloodsitax-default-rtdb.firebaseio.com",
    projectId: "contador-muertes-bloodsitax",
    storageBucket: "contador-muertes-bloodsitax.firebasestorage.app",
    messagingSenderId: "998138833144",
    appId: "1:998138833144:web:91f330197ae227c16cb30d"
  };

  // Mismo valor en el panel y en el overlay
  const RUTA = "gears-colab/muertes";

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const els = {
    kizashi: document.getElementById("num-kizashi"),
    bloodsitax: document.getElementById("num-bloodsitax")
  };
  const previo = { kizashi: null, bloodsitax: null };

  function pintar(quien, valor) {
    const el = els[quien];
    if (previo[quien] === valor) return;
    const primera = previo[quien] === null;
    previo[quien] = valor;
    el.textContent = valor;
    el.classList.toggle("largo", String(valor).length >= 4);
    if (!primera) {
      el.classList.remove("bump");
      void el.offsetWidth;
      el.classList.add("bump");
    }
  }

  onValue(ref(db, RUTA), (snap) => {
    const v = snap.val() || {};
    pintar("kizashi", Number(v.kizashi) || 0);
    pintar("bloodsitax", Number(v.bloodsitax) || 0);
  });
</script>

<script>
  // Escalar el escenario al tamano del Browser Source
  (function () {
    const stage = document.getElementById("stage");
    function ajustar() {
      const s = Math.min(window.innerWidth / 1040, window.innerHeight / 372);
      stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
    }
    window.addEventListener("resize", ajustar);
    ajustar();
  })();
</script>
</body>
</html>
