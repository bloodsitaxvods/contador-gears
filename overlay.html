<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Marcador de muertes - Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --negro: #0D0D0D;
    --neon: #FF007F;
    --pastel: #FFC1DA;
    --blanco: #FFFFFF;
    --rojo-marco: #D81B26;
    --rojo-texto: #FF3040;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  /* Escenario fijo de 832x323 que se escala para llenar el Browser Source */
  #stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 832px;
    height: 323px;
    transform-origin: center center;
    transform: translate(-50%, -50%);
    font-family: 'Fredoka', 'Quicksand', 'Segoe UI', sans-serif;
  }

  /* Solo se muestra una de las dos escenas, segun el modo */
  #stage[data-modo="dos"] .solo-uno { display: none; }
  #stage[data-modo="uno"] .solo-dos { display: none; }

  /* Titulo central, encima de los dos nombres */
  .titulo {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 8px;
    text-indent: 8px;
    color: var(--blanco);
    text-shadow: 0 0 14px rgba(255, 255, 255, 0.3), 0 2px 8px rgba(0, 0, 0, 0.9);
  }
  .titulo::before,
  .titulo::after {
    content: "";
    width: 150px;
    height: 3px;
    border-radius: 2px;
  }
  .titulo::before {
    background: linear-gradient(to right, transparent, var(--rojo-marco));
    box-shadow: 0 0 10px rgba(216, 27, 38, 0.6);
  }
  .titulo::after {
    background: linear-gradient(to left, transparent, var(--neon));
    box-shadow: 0 0 10px rgba(255, 0, 127, 0.6);
  }

  /* Nombres como pestana pegada al borde superior de cada marco */
  .nombre {
    position: absolute;
    top: 40px;
    width: 416px;
    height: 42px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  #nombre-kizashi { left: 0; }
  #nombre-bloodsitax { left: 416px; }
  #nombre-total { left: 208px; }

  .placa {
    box-sizing: border-box;
    height: 40px;
    max-width: 416px;
    padding: 0 16px;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    white-space: nowrap;
    border: 2px solid;
    border-bottom: 0;
    border-radius: 12px 12px 0 0;
    background: rgba(10, 10, 12, 0.78);
  }
  #nombre-kizashi .placa {
    border-color: var(--rojo-marco);
    color: var(--blanco);
    box-shadow: 0 0 14px rgba(216, 27, 38, 0.5);
  }
  #nombre-total .placa {
    border-color: var(--rojo-marco);
    color: var(--rojo-texto);
    box-shadow: 0 0 14px rgba(216, 27, 38, 0.5);
  }
  #nombre-bloodsitax .placa {
    border-color: var(--neon);
    color: var(--pastel);
    box-shadow: 0 0 14px rgba(255, 0, 127, 0.55);
  }
  /* Nombre y apodo con el mismo tamano; --tam lo ajusta el script si no cabe */
  #nombre-total .principal { letter-spacing: 6px; text-indent: 6px; }

  .principal,
  .sufijo {
    font-size: var(--tam, 28px);
    font-weight: 700;
    letter-spacing: 2.5px;
    line-height: 1;
    text-shadow: var(--brillo, none);
  }

  /* Marcos pegados, sin sobreponerse (cada PNG mide 1649 x 954) */
  .marco {
    position: absolute;
    top: 82px;
    width: 416px;
    height: 241px;
  }
  #marco-kizashi { left: 0; }
  #marco-bloodsitax { left: 416px; }
  #marco-total { left: 208px; }

  /* Relleno de color que queda DETRAS del marco, dentro del hueco.
     Los tres tonos se calculan desde un solo color base. */
  .relleno {
    position: absolute;
    left: 6.5%;
    right: 6.5%;
    top: 9%;
    bottom: 10%;
    border-radius: 12px;
    background: radial-gradient(ellipse at center, var(--c1) 0%, var(--c2) 65%, var(--c3) 100%);
  }
  #marco-kizashi .relleno,
  #marco-total .relleno     { --c1: #1C1C1C; --c2: #0B0B0B; --c3: #080808; }
  #marco-bloodsitax .relleno { --c1: #FF0F86; --c2: #E6006F; --c3: #A60052; }

  .arte {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }

  /* Zona segura del numero: lejos de engranajes, balas, sierra y estandarte */
  .contenido {
    position: absolute;
    left: 18%;
    right: 18%;
    top: 19%;
    bottom: 17%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .numero {
    font-size: 140px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    transform-origin: center 60%;
  }
  /* Con 4 digitos el numero se achica para no tocar el marco */
  .numero.largo { font-size: 104px; }

  #marco-kizashi .contenido,
  #marco-total .contenido {
    color: var(--blanco);
    text-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
  }
  #marco-bloodsitax .contenido {
    color: var(--pastel);
    text-shadow: 0 3px 8px rgba(110, 0, 55, 0.6);
  }

  .bump {
    animation: bump 380ms cubic-bezier(.2, 1.4, .4, 1);
  }

  @keyframes bump {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .bump { animation: none; }
  }
</style>
</head>
<body>

<div id="stage" data-modo="dos">
  <div class="titulo solo-dos">MUERTES</div>

  <div class="nombre solo-dos" id="nombre-kizashi">
    <div class="placa"><span class="principal">KIZASHI</span><span class="sufijo">- TURIP</span></div>
  </div>
  <div class="nombre solo-dos" id="nombre-bloodsitax">
    <div class="placa"><span class="principal">BLOODSITAX</span><span class="sufijo">- SUPOR</span></div>
  </div>

  <div class="marco solo-dos" id="marco-kizashi">
    <div class="relleno"></div>
    <img class="arte" src="marco-kizashi.png" alt="">
    <div class="contenido">
      <div class="numero" id="num-kizashi">0</div>
    </div>
  </div>

  <div class="marco solo-dos" id="marco-bloodsitax">
    <div class="relleno"></div>
    <img class="arte" src="marco-bloodsitax.png" alt="">
    <div class="contenido">
      <div class="numero" id="num-bloodsitax">0</div>
    </div>
  </div>

  <!-- Opcion 2: un solo marco con el contador total -->
  <div class="nombre solo-uno" id="nombre-total">
    <div class="placa"><span class="principal">MUERTES</span></div>
  </div>

  <div class="marco solo-uno" id="marco-total">
    <div class="relleno"></div>
    <img class="arte" src="marco-kizashi.png" alt="">
    <div class="contenido">
      <div class="numero" id="num-total">0</div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA1xhXuc4pAfNF_ffk62MZV9OFy04R9TQw",
    authDomain: "contador-muertes-gears.firebaseapp.com",
    databaseURL: "https://contador-muertes-gears-default-rtdb.firebaseio.com",
    projectId: "contador-muertes-gears",
    storageBucket: "contador-muertes-gears.firebasestorage.app",
    messagingSenderId: "452392131143",
    appId: "1:452392131143:web:d9c09f82c3c7c168f26f62"
  };

  // Mismo valor en el panel y en el overlay
  const RUTA = "gears-colab/muertes";
  const RUTA_COLORES = "gears-colab/colores";
  const RUTA_BRILLO = "gears-colab/brillo";
  const RUTA_MODO = "gears-colab/modo";
  const JUGADORES = ["kizashi", "bloodsitax", "total"];

  // Colores del fondo de cada marco. El boton de descarga del panel
  // reemplaza estas dos lineas para dejar los colores fijos.
  const COLORES_BASE = {kizashi: "#0D0D0D", bloodsitax: "#FF007F", total: "#0D0D0D"};
  const BRILLO_BASE = {kizashi: {activo: true, nivel: 40}, bloodsitax: {activo: true, nivel: 40}, total: {activo: true, nivel: 40}};
  const MODO_BASE = "dos";
  const SINCRONIZAR_COLORES = true;

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  /* ---------- Contadores ---------- */
  const els = {};
  const previo = {};
  JUGADORES.forEach((j) => {
    els[j] = document.getElementById("num-" + j);
    previo[j] = null;
  });

  function pintar(quien, valor) {
    const el = els[quien];
    if (previo[quien] === valor) return;
    const primera = previo[quien] === null;
    previo[quien] = valor;
    el.textContent = valor;
    el.classList.toggle("largo", String(valor).length >= 4);
    if (!primera) {
      el.classList.remove("bump");
      void el.offsetWidth;
      el.classList.add("bump");
    }
  }

  onValue(ref(db, RUTA), (snap) => {
    const v = snap.val() || {};
    JUGADORES.forEach((j) => pintar(j, Number(v[j]) || 0));
  });

  /* ---------- Color de fondo del marco ---------- */
  function mezclar(hex, destino, p) {
    const n = parseInt(hex.slice(1), 16);
    const canales = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    const d = destino === "blanco" ? 255 : 0;
    return "#" + canales
      .map((c) => Math.round(c + (d - c) * p).toString(16).padStart(2, "0"))
      .join("");
  }

  function aplicarColor(quien, hex) {
    if (typeof hex !== "string" || !/^#[0-9a-f]{6}$/i.test(hex)) return;
    const relleno = document.querySelector("#marco-" + quien + " .relleno");
    relleno.style.setProperty("--c1", mezclar(hex, "blanco", 0.06));
    relleno.style.setProperty("--c2", mezclar(hex, "negro", 0.10));
    relleno.style.setProperty("--c3", mezclar(hex, "negro", 0.35));
  }

  JUGADORES.forEach((j) => aplicarColor(j, COLORES_BASE[j]));

  if (SINCRONIZAR_COLORES) {
    onValue(ref(db, RUTA_COLORES), (snap) => {
      const v = snap.val() || {};
      JUGADORES.forEach((j) => aplicarColor(j, v[j] || COLORES_BASE[j]));
    });
  }

  /* ---------- Brillo del nombre (negro en Kizashi, neon en Bloodsitax) ---------- */
  function aplicarBrillo(quien, cfg) {
    const placa = document.querySelector("#nombre-" + quien + " .placa");
    const activo = !cfg || cfg.activo !== false;
    let nivel = Number(cfg && cfg.nivel);
    if (Number.isNaN(nivel)) nivel = 40;
    nivel = Math.max(0, Math.min(100, nivel));
    if (!activo || nivel === 0) {
      placa.style.setProperty("--brillo", "none");
      return;
    }
    const r = (nivel / 100) * 18;
    const paleta = {
      kizashi: ["rgba(0,0,0,0.95)", "rgba(0,0,0,0.6)"],
      bloodsitax: ["rgba(255,0,127,0.95)", "rgba(255,0,127,0.6)"],
      total: ["rgba(255,40,55,0.95)", "rgba(255,40,55,0.6)"]
    };
    const colores = paleta[quien];
    placa.style.setProperty(
      "--brillo",
      "0 0 " + r.toFixed(1) + "px " + colores[0] + ", 0 0 " + (r * 2).toFixed(1) + "px " + colores[1]
    );
  }

  JUGADORES.forEach((j) => aplicarBrillo(j, BRILLO_BASE[j]));

  if (SINCRONIZAR_COLORES) {
    onValue(ref(db, RUTA_BRILLO), (snap) => {
      const v = snap.val() || {};
      JUGADORES.forEach((j) => aplicarBrillo(j, v[j] || BRILLO_BASE[j]));
    });
  }

  /* ---------- Mismo tamano de letra en los dos nombres, achicando si no caben ---------- */
  function ajustarNombres() {
    const placas = document.querySelectorAll(".placa");
    for (let tam = 28; tam >= 16; tam--) {
      placas.forEach((p) => p.style.setProperty("--tam", tam + "px"));
      const cabe = Array.from(placas).every((p) => p.scrollWidth <= 408);
      if (cabe) break;
    }
  }
  /* ---------- Modo: opcion 1 (dos marcos) u opcion 2 (un marco con el total) ---------- */
  function aplicarModo(modo) {
    const m = modo === "uno" ? "uno" : "dos";
    document.getElementById("stage").setAttribute("data-modo", m);
    ajustarNombres();
  }
  aplicarModo(MODO_BASE);
  if (SINCRONIZAR_COLORES) {
    onValue(ref(db, RUTA_MODO), (snap) => aplicarModo(snap.val() || MODO_BASE));
  }

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajustarNombres);
</script>

<script>
  // Escalar el escenario al tamano del Browser Source
  (function () {
    const stage = document.getElementById("stage");
    function ajustar() {
      const s = Math.min(window.innerWidth / 832, window.innerHeight / 323);
      stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
    }
    window.addEventListener("resize", ajustar);
    ajustar();
  })();
</script>
</body>
</html>
