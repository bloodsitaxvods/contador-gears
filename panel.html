<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Marcador de muertes - Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --negro: #0D0D0D;
    --fondo: #17121A;
    --neon: #FF007F;
    --pastel: #FFC1DA;
    --blanco: #FFFFFF;
    --gris: #2A2230;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--fondo);
    color: var(--blanco);
    font-family: 'Fredoka', 'Quicksand', 'Segoe UI', sans-serif;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    padding: 18px;
    max-width: 1100px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }

  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .estado {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    opacity: 0.85;
  }
  .punto {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #777;
  }
  .punto.ok { background: #5BE08A; }
  .punto.mal { background: #FF5A5A; }

  .aviso {
    display: none;
    margin-bottom: 14px;
    padding: 12px 14px;
    border-radius: 14px;
    background: #4A1830;
    color: var(--pastel);
    font-size: 14px;
    line-height: 1.45;
  }
  .aviso.visible { display: block; }

  .modos {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .modo {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    padding: 12px 16px;
    border-radius: 16px;
    background: var(--gris);
    color: var(--blanco);
    font-size: 16px;
    font-weight: 600;
    text-align: left;
    border: 2px solid transparent;
  }
  .modo small {
    font-size: 13px;
    font-weight: 400;
    opacity: 0.7;
  }
  .modo[aria-pressed="true"] {
    border-color: var(--pastel);
    background: #3A2540;
  }

  body[data-modo="dos"] #j-total { display: none; }
  body[data-modo="uno"] #j-kizashi,
  body[data-modo="uno"] #j-bloodsitax { display: none; }
  body[data-modo="uno"] .tablero {
    grid-template-columns: 1fr;
    max-width: 540px;
    margin: 0 auto;
  }

  #j-total {
    background: var(--negro);
    border: 2px solid #D81B26;
    box-shadow: 0 0 26px rgba(216, 27, 38, 0.35);
  }
  #j-total .nombre { color: #FF3040; }
  #j-total .grande {
    background: #D81B26;
    color: var(--blanco);
  }

  .tablero {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .jugador {
    border-radius: 24px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  #j-kizashi {
    background: var(--negro);
    border: 2px solid rgba(255, 255, 255, 0.16);
  }
  #j-bloodsitax {
    background: var(--neon);
    color: var(--pastel);
    box-shadow: 0 0 26px rgba(255, 0, 127, 0.4);
  }

  .encabezado {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 4px 10px;
  }
  .nombre {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 2px;
  }
  .atajo {
    font-size: 13px;
    opacity: 0.6;
  }

  .cuenta {
    font-size: 96px;
    font-weight: 700;
    line-height: 1;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: 0;
    border-radius: 18px;
    transition: transform 80ms ease, filter 120ms ease;
  }
  button:active { transform: scale(0.97); }
  button:focus-visible, input:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 2px;
  }

  .grande {
    height: 170px;
    font-size: 64px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  #j-kizashi .grande {
    background: var(--blanco);
    color: var(--negro);
  }
  #j-bloodsitax .grande {
    background: var(--pastel);
    color: #8A0047;
  }
  .grande:hover { filter: brightness(0.95); }

  .correccion {
    display: grid;
    grid-template-columns: 90px 1fr auto;
    gap: 8px;
    align-items: center;
  }
  .chico {
    height: 40px;
    font-size: 15px;
    font-weight: 500;
    padding: 0 12px;
    background: rgba(255, 255, 255, 0.14);
    color: inherit;
    border-radius: 12px;
  }
  .chico:hover { background: rgba(255, 255, 255, 0.24); }

  input[type="number"] {
    height: 40px;
    width: 100%;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(0, 0, 0, 0.3);
    color: inherit;
    font-family: inherit;
    font-size: 16px;
    padding: 0 12px;
  }

  .fondo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-top: 2px;
    font-size: 14px;
  }
  .fondo label {
    flex: 1;
    opacity: 0.85;
  }
  input[type="color"] {
    width: 52px;
    height: 38px;
    padding: 2px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    background: rgba(0, 0, 0, 0.3);
    cursor: pointer;
  }

  .brillo {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
    font-size: 14px;
  }
  .brillo label.titulo-fila {
    flex: 1 1 100%;
    opacity: 0.85;
  }
  .brillo input[type="range"] {
    flex: 1;
    min-width: 120px;
    height: 28px;
    accent-color: currentColor;
    cursor: pointer;
  }
  .brillo .valor {
    min-width: 34px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    opacity: 0.85;
  }
  .interruptor {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    opacity: 0.9;
  }
  .interruptor input {
    width: 18px;
    height: 18px;
    accent-color: currentColor;
    cursor: pointer;
  }

  footer {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  footer .acciones { display: flex; gap: 8px; }
  footer .chico { background: var(--gris); color: var(--blanco); }
  footer .peligro { background: #4A1830; color: var(--pastel); }

  .ayuda {
    font-size: 13px;
    opacity: 0.6;
    line-height: 1.5;
  }

  @media (max-width: 640px) {
    body { padding: 12px; }
    .modo { padding: 10px 12px; font-size: 14px; }
    .modo small { font-size: 12px; }
    .tablero { gap: 10px; }
    .jugador { padding: 12px; border-radius: 20px; }
    .nombre { font-size: 11px; letter-spacing: 0.5px; white-space: nowrap; }
    .atajo { display: none; }
    .cuenta { font-size: 64px; }
    .grande { height: 150px; font-size: 52px; }
    .correccion { grid-template-columns: 1fr; }
  }
</style>
</head>
<body data-modo="dos">

<header>
  <h1>Marcador de muertes</h1>
  <div class="estado"><span class="punto" id="punto"></span><span id="estado-texto">Conectando</span></div>
</header>

<div class="aviso" id="aviso" role="alert"></div>

<div class="modos" role="group" aria-label="Modo del overlay">
  <button class="modo" id="modo-dos" aria-pressed="true">Opcion 1: dos marcos<small>Kizashi y Bloodsitax</small></button>
  <button class="modo" id="modo-uno" aria-pressed="false">Opcion 2: un marco<small>Contador total de muertes</small></button>
</div>


<main class="tablero">
  <section class="jugador" id="j-kizashi">
    <div class="encabezado">
      <span class="nombre">KIZASHI - TURIP</span>
      <span class="atajo">tecla 1</span>
    </div>
    <div class="cuenta" id="cuenta-kizashi">0</div>
    <button class="grande" id="mas-kizashi" aria-label="Sumar una muerte a Kizashi">+1</button>
    <div class="correccion">
      <button class="chico" id="menos-kizashi" aria-label="Restar una muerte a Kizashi">Restar 1</button>
      <input type="number" min="0" id="valor-kizashi" placeholder="Valor exacto" aria-label="Valor exacto de Kizashi">
      <button class="chico" id="fijar-kizashi">Fijar</button>
    </div>
    <div class="fondo">
      <label for="color-kizashi">Fondo del marco</label>
      <input type="color" id="color-kizashi" aria-label="Color de fondo del marco de kizashi">
      <button class="chico" id="restaurar-kizashi">Restaurar</button>
    </div>
    <div class="brillo">
      <label class="titulo-fila" for="brillo-kizashi">Brillo del nombre</label>
      <input type="range" id="brillo-kizashi" min="0" max="100" step="1" aria-label="Intensidad del brillo del nombre de kizashi">
      <span class="valor" id="valor-brillo-kizashi">40</span>
      <label class="interruptor"><input type="checkbox" id="brillo-on-kizashi" checked>Activo</label>
    </div>
  </section>

  <section class="jugador" id="j-bloodsitax">
    <div class="encabezado">
      <span class="nombre">BLOODSITAX - SUPOR</span>
      <span class="atajo">tecla 2</span>
    </div>
    <div class="cuenta" id="cuenta-bloodsitax">0</div>
    <button class="grande" id="mas-bloodsitax" aria-label="Sumar una muerte a Bloodsitax">+1</button>
    <div class="correccion">
      <button class="chico" id="menos-bloodsitax" aria-label="Restar una muerte a Bloodsitax">Restar 1</button>
      <input type="number" min="0" id="valor-bloodsitax" placeholder="Valor exacto" aria-label="Valor exacto de Bloodsitax">
      <button class="chico" id="fijar-bloodsitax">Fijar</button>
    </div>
    <div class="fondo">
      <label for="color-bloodsitax">Fondo del marco</label>
      <input type="color" id="color-bloodsitax" aria-label="Color de fondo del marco de bloodsitax">
      <button class="chico" id="restaurar-bloodsitax">Restaurar</button>
    </div>
    <div class="brillo">
      <label class="titulo-fila" for="brillo-bloodsitax">Brillo del nombre</label>
      <input type="range" id="brillo-bloodsitax" min="0" max="100" step="1" aria-label="Intensidad del brillo del nombre de bloodsitax">
      <span class="valor" id="valor-brillo-bloodsitax">40</span>
      <label class="interruptor"><input type="checkbox" id="brillo-on-bloodsitax" checked>Activo</label>
    </div>
  </section>

  <section class="jugador" id="j-total">
    <div class="encabezado">
      <span class="nombre">MUERTES</span>
      <span class="atajo">tecla 3</span>
    </div>
    <div class="cuenta" id="cuenta-total">0</div>
    <button class="grande" id="mas-total" aria-label="Sumar una muerte al contador total">+1</button>
    <div class="correccion">
      <button class="chico" id="menos-total" aria-label="Restar una muerte al contador total">Restar 1</button>
      <input type="number" min="0" id="valor-total" placeholder="Valor exacto" aria-label="Valor exacto del contador total">
      <button class="chico" id="fijar-total">Fijar</button>
    </div>
    <div class="fondo">
      <label for="color-total">Fondo del marco</label>
      <input type="color" id="color-total" aria-label="Color de fondo del marco del contador total">
      <button class="chico" id="restaurar-total">Restaurar</button>
    </div>
    <div class="brillo">
      <label class="titulo-fila" for="brillo-total">Brillo del titulo</label>
      <input type="range" id="brillo-total" min="0" max="100" step="1" aria-label="Intensidad del brillo del nombre del contador total">
      <span class="valor" id="valor-brillo-total">40</span>
      <label class="interruptor"><input type="checkbox" id="brillo-on-total" checked>Activo</label>
    </div>
  </section>
</main>

<footer>
  <div class="acciones">
    <button class="chico" id="deshacer">Deshacer ultimo cambio</button>
    <button class="chico peligro" id="reiniciar">Reiniciar a 0</button>
    <button class="chico" id="descargar">Descargar overlay con estos ajustes</button>
  </div>
  <div class="ayuda">
    Atajos con esta pestana activa. Opcion 1: 1 suma a Kizashi, 2 suma a Bloodsitax. Opcion 2: 1 o 3 suman al total.<br>
    Con Shift resta. Z deshace.
  </div>
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, runTransaction, set, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA1xhXuc4pAfNF_ffk62MZV9OFy04R9TQw",
    authDomain: "contador-muertes-gears.firebaseapp.com",
    databaseURL: "https://contador-muertes-gears-default-rtdb.firebaseio.com",
    projectId: "contador-muertes-gears",
    storageBucket: "contador-muertes-gears.firebasestorage.app",
    messagingSenderId: "452392131143",
    appId: "1:452392131143:web:d9c09f82c3c7c168f26f62"
  };

  // Mismo valor en el panel y en el overlay
  const RUTA = "gears-colab/muertes";

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const $ = (id) => document.getElementById(id);
  const jugadores = ["kizashi", "bloodsitax", "total"];
  const historial = [];

  function avisar(texto) {
    const a = $("aviso");
    if (!texto) { a.classList.remove("visible"); a.textContent = ""; return; }
    a.textContent = texto;
    a.classList.add("visible");
  }

  function errorFirebase(e) {
    const txt = String((e && (e.code || e.message)) || e);
    console.error("Error de Firebase:", e);
    if (/permission/i.test(txt)) {
      avisar("Firebase rechazo el cambio por permisos. Revisa en Realtime Database > Reglas que exista la ruta gears-colab/muertes con .read y .write en true, y que hayas pulsado Publicar.");
    } else {
      avisar("No se pudo guardar el cambio: " + txt);
    }
  }

  let conectado = false;
  setTimeout(() => {
    if (!conectado) {
      avisar("No hay conexion con Firebase despues de 8 segundos. Revisa la databaseURL en el codigo y que la base de datos Realtime Database exista en el proyecto.");
    }
  }, 8000);

  // Conexion
  onValue(ref(db, ".info/connected"), (snap) => {
    const ok = snap.val() === true;
    if (ok) { conectado = true; }
    $("punto").className = "punto " + (ok ? "ok" : "mal");
    $("estado-texto").textContent = ok ? "En linea" : "Sin conexion";
  });

  // Valores en tiempo real
  onValue(ref(db, RUTA), (snap) => {
    const v = snap.val() || {};
    jugadores.forEach((j) => { $("cuenta-" + j).textContent = Number(v[j]) || 0; });
  }, errorFirebase);

  // Cambio atomico: si los dos suman al mismo tiempo no se pisan
  function cambiar(quien, delta, guardar = true) {
    return runTransaction(ref(db, `${RUTA}/${quien}`), (actual) => {
      return Math.max(0, (Number(actual) || 0) + delta);
    }).then((res) => {
      avisar("");
      if (guardar && res.committed) historial.push({ quien, delta });
    }).catch(errorFirebase);
  }

  jugadores.forEach((j) => {
    $("mas-" + j).addEventListener("click", () => cambiar(j, 1));
    $("menos-" + j).addEventListener("click", () => cambiar(j, -1));
    $("fijar-" + j).addEventListener("click", () => {
      const campo = $("valor-" + j);
      const n = parseInt(campo.value, 10);
      if (Number.isNaN(n) || n < 0) return;
      set(ref(db, `${RUTA}/${j}`), n).catch(errorFirebase);
      historial.length = 0;
      campo.value = "";
    });
    $("valor-" + j).addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("fijar-" + j).click();
    });
  });

  function deshacer() {
    const ultimo = historial.pop();
    if (!ultimo) return;
    cambiar(ultimo.quien, -ultimo.delta, false);
  }
  $("deshacer").addEventListener("click", deshacer);

  $("reiniciar").addEventListener("click", () => {
    const visibles = modo === "uno" ? ["total"] : ["kizashi", "bloodsitax"];
    const texto = modo === "uno" ? "Esto deja el contador total en 0. Continuar?" : "Esto deja a los dos en 0. Continuar?";
    if (!confirm(texto)) return;
    const ceros = {};
    visibles.forEach((j) => { ceros[j] = 0; });
    update(ref(db, RUTA), ceros).catch(errorFirebase);
    historial.length = 0;
  });



  // Modo del overlay: "dos" (opcion 1) o "uno" (opcion 2)
  const RUTA_MODO = "gears-colab/modo";
  let modo = "dos";

  function pintarModo(m) {
    modo = m === "uno" ? "uno" : "dos";
    document.body.dataset.modo = modo;
    $("modo-dos").setAttribute("aria-pressed", String(modo === "dos"));
    $("modo-uno").setAttribute("aria-pressed", String(modo === "uno"));
  }

  $("modo-dos").addEventListener("click", () => {
    pintarModo("dos");
    set(ref(db, RUTA_MODO), "dos").catch(errorFirebase);
  });
  $("modo-uno").addEventListener("click", () => {
    pintarModo("uno");
    set(ref(db, RUTA_MODO), "uno").catch(errorFirebase);
  });
  onValue(ref(db, RUTA_MODO), (snap) => pintarModo(snap.val()), errorFirebase);

  // Color de fondo del marco (se guarda en Firebase y el overlay lo lee en vivo)
  const RUTA_COLORES = "gears-colab/colores";
  const COLOR_BASE = { kizashi: "#0d0d0d", bloodsitax: "#ff007f", total: "#0d0d0d" };
  const esperaColor = {};

  jugadores.forEach((j) => {
    const campo = $("color-" + j);
    campo.value = COLOR_BASE[j];
    campo.addEventListener("input", () => {
      clearTimeout(esperaColor[j]);
      esperaColor[j] = setTimeout(() => {
        set(ref(db, `${RUTA_COLORES}/${j}`), campo.value).catch(errorFirebase);
      }, 120);
    });
    $("restaurar-" + j).addEventListener("click", () => {
      campo.value = COLOR_BASE[j];
      set(ref(db, `${RUTA_COLORES}/${j}`), COLOR_BASE[j]).catch(errorFirebase);
    });
  });

  onValue(ref(db, RUTA_COLORES), (snap) => {
    const v = snap.val() || {};
    jugadores.forEach((j) => {
      const campo = $("color-" + j);
      const c = v[j];
      if (typeof c === "string" && /^#[0-9a-f]{6}$/i.test(c) && document.activeElement !== campo) {
        campo.value = c.toLowerCase();
      }
    });
  }, errorFirebase);


  // Brillo del nombre: intensidad 0-100 y opcion de quitarlo por completo
  const RUTA_BRILLO = "gears-colab/brillo";
  const BRILLO_BASE = { activo: true, nivel: 40 };
  const esperaBrillo = {};

  function leerBrillo(j) {
    return { activo: $("brillo-on-" + j).checked, nivel: Number($("brillo-" + j).value) };
  }

  function pintarBrillo(j, cfg) {
    $("brillo-" + j).value = cfg.nivel;
    $("valor-brillo-" + j).textContent = cfg.nivel;
    $("brillo-on-" + j).checked = cfg.activo;
    $("brillo-" + j).disabled = !cfg.activo;
  }

  function guardarBrillo(j) {
    clearTimeout(esperaBrillo[j]);
    esperaBrillo[j] = setTimeout(() => {
      set(ref(db, `${RUTA_BRILLO}/${j}`), leerBrillo(j)).catch(errorFirebase);
    }, 120);
  }

  jugadores.forEach((j) => {
    pintarBrillo(j, BRILLO_BASE);
    $("brillo-" + j).addEventListener("input", () => {
      $("valor-brillo-" + j).textContent = $("brillo-" + j).value;
      guardarBrillo(j);
    });
    $("brillo-on-" + j).addEventListener("change", () => {
      $("brillo-" + j).disabled = !$("brillo-on-" + j).checked;
      guardarBrillo(j);
    });
  });

  onValue(ref(db, RUTA_BRILLO), (snap) => {
    const v = snap.val() || {};
    jugadores.forEach((j) => {
      const c = v[j];
      if (!c || document.activeElement === $("brillo-" + j)) return;
      const nivel = Number(c.nivel);
      pintarBrillo(j, {
        activo: c.activo !== false,
        nivel: Number.isNaN(nivel) ? BRILLO_BASE.nivel : Math.max(0, Math.min(100, nivel))
      });
    });
  }, errorFirebase);

  // Descarga el overlay final con los colores actuales fijos
  $("descargar").addEventListener("click", async () => {
    try {
      const resp = await fetch("overlay.html", { cache: "no-store" });
      if (!resp.ok) throw new Error("No se encontro overlay.html");
      let html = await resp.text();
      const colores = {};
      jugadores.forEach((j) => { colores[j] = $("color-" + j).value.toUpperCase(); });
      html = html.replace(/const COLORES_BASE = \{[^}]*\};/, `const COLORES_BASE = ${JSON.stringify(colores)};`);
      html = html.replace(/const MODO_BASE = "[a-z]*";/, `const MODO_BASE = "${modo}";`);
      const brillo = {};
      jugadores.forEach((j) => { brillo[j] = leerBrillo(j); });
      html = html.replace(/const BRILLO_BASE = \{.*\};/, `const BRILLO_BASE = ${JSON.stringify(brillo)};`);
      html = html.replace("const SINCRONIZAR_COLORES = true;", "const SINCRONIZAR_COLORES = false;");
      const blob = new Blob([html], { type: "text/html" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "overlay.html";
      a.click();
      URL.revokeObjectURL(a.href);
      avisar("");
    } catch (e) {
      avisar("No se pudo generar el archivo. Abre el panel desde la direccion de GitHub Pages, no desde un archivo guardado en tu PC.");
    }
  });

  // Atajos de teclado (solo con esta pestana enfocada)
  window.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.ctrlKey || e.metaKey || e.altKey) return;
    const delta = e.shiftKey ? -1 : 1;
    const uno = e.code === "Digit1" || e.code === "Numpad1";
    const dos = e.code === "Digit2" || e.code === "Numpad2";
    const tres = e.code === "Digit3" || e.code === "Numpad3";
    if (modo === "dos" && uno) { cambiar("kizashi", delta); e.preventDefault(); }
    else if (modo === "dos" && dos) { cambiar("bloodsitax", delta); e.preventDefault(); }
    else if (modo === "uno" && (uno || tres)) { cambiar("total", delta); e.preventDefault(); }
    else if (e.code === "KeyZ") { deshacer(); e.preventDefault(); }
  });
</script>
